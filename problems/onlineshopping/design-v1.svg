<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#1f2328">Online Shopping Service — v1 entities</text>
  <text x="40" y="66" font-size="13" fill="#57606a">First design pass. Dashed box marks what the model cannot yet express.</text>

  <!-- ============ USER ============ -->
  <rect x="40" y="120" width="230" height="140" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 40 128 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" fill="#ddf4ff"/>
  <line x1="40" y1="152" x2="270" y2="152" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="56" y="144" font-size="14" font-weight="700" fill="#0550ae">User</text>

  <text x="56" y="176" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">ID<tspan fill="#57606a">          string</tspan></text>
  <text x="56" y="200" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Name<tspan fill="#57606a">        string</tspan></text>
  <text x="56" y="224" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Email<tspan fill="#57606a">       string</tspan></text>
  <text x="56" y="248" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Orders<tspan fill="#57606a">      []Order</tspan></text>

  <!-- ============ ORDER ============ -->
  <rect x="375" y="132" width="230" height="116" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 375 140 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" fill="#ddf4ff"/>
  <line x1="375" y1="164" x2="605" y2="164" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="391" y="156" font-size="14" font-weight="700" fill="#0550ae">Order</text>

  <text x="391" y="188" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">OrderID<tspan fill="#57606a">     string</tspan></text>
  <text x="391" y="212" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Products<tspan fill="#57606a">    []Product</tspan></text>
  <text x="391" y="236" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">CartValue<tspan fill="#57606a">   money</tspan></text>

  <!-- ============ PRODUCT ============ -->
  <rect x="710" y="108" width="230" height="164" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 710 116 a 8 8 0 0 1 8 -8 h 214 a 8 8 0 0 1 8 8 v 24 h -230 z" fill="#ddf4ff"/>
  <line x1="710" y1="140" x2="940" y2="140" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="726" y="132" font-size="14" font-weight="700" fill="#0550ae">Product</text>

  <text x="726" y="164" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">ID<tspan fill="#57606a">          string</tspan></text>
  <text x="726" y="188" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Name<tspan fill="#57606a">        string</tspan></text>
  <text x="726" y="212" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Description<tspan fill="#57606a"> string</tspan></text>
  <text x="726" y="236" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Inventory<tspan fill="#57606a">   int</tspan></text>
  <text x="726" y="260" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2328">Price<tspan fill="#57606a">       money</tspan></text>

  <!-- ============ ARROWS ============ -->
  <line x1="270" y1="190" x2="368" y2="190" stroke="#6e7781" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="319" y="181" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">places</text>
  <text x="319" y="208" font-size="11.5" fill="#57606a" text-anchor="middle">1 → many</text>

  <line x1="605" y1="190" x2="703" y2="190" stroke="#6e7781" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="654" y="181" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">contains</text>
  <text x="654" y="208" font-size="11.5" fill="#57606a" text-anchor="middle">1 → many</text>

  <!-- ============ GAPS ============ -->
  <rect x="375" y="308" width="565" height="118" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="393" y="332" font-size="13" font-weight="700" fill="#7d4e00">Not expressible in v1</text>

  <text x="393" y="356" font-size="12.5" fill="#4d2d00">• <tspan font-weight="600">Quantity</tspan> — a list of products cannot say &#8220;2 of this one&#8221;</text>
  <text x="393" y="378" font-size="12.5" fill="#4d2d00">• <tspan font-weight="600">Price at purchase</tspan> — Order points at Product, so past orders reprice</text>
  <text x="393" y="400" font-size="12.5" fill="#4d2d00">• <tspan font-weight="600">Order status</tspan> — no Pending / Shipped / Delivered / Cancelled</text>
  <text x="393" y="418" font-size="12.5" fill="#4d2d00">• <tspan font-weight="600">Cart</tspan> — a mutable pre-checkout basket is missing; Order is doing both jobs</text>

  <line x1="490" y1="248" x2="490" y2="304" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- ============ RACE NOTE ============ -->
  <rect x="710" y="288" width="0" height="0" fill="none"/>
  <text x="40" y="332" font-size="13" font-weight="700" fill="#1f2328">Hotspot</text>
  <text x="40" y="356" font-size="12.5" fill="#57606a">Product.Inventory is</text>
  <text x="40" y="374" font-size="12.5" fill="#57606a">shared mutable state.</text>
  <text x="40" y="392" font-size="12.5" fill="#57606a">Two checkouts racing</text>
  <text x="40" y="410" font-size="12.5" fill="#57606a">for the last unit both</text>
  <text x="40" y="428" font-size="12.5" fill="#57606a">read 1, both decrement.</text>
  <line x1="270" y1="360" x2="270" y2="360" stroke="none"/>
  <path d="M 825 272 L 825 296 L 700 296" stroke="#cf222e" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="838" y="290" font-size="11.5" font-weight="600" fill="#cf222e">race</text>
</svg>
