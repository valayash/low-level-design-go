<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#6e7781" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="740" fill="#ffffff"/>

  <text x="40" y="38" font-size="19" font-weight="700" fill="#1f2328">Online Shopping Service — current model</text>
  <text x="40" y="60" font-size="13" fill="#57606a">Service layer owns the registries and runs checkout. Entities own only their own rules.</text>

  <!-- arc: service -> product -->
  <path d="M 360 140 C 550 72, 900 72, 1085 92" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="720" y="72" font-size="11" font-weight="600" fill="#57606a" text-anchor="middle">registers</text>

  <!-- ============ SERVICE ============ -->
  <rect x="40" y="100" width="320" height="205" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <path d="M 40 108 a 8 8 0 0 1 8 -8 h 304 a 8 8 0 0 1 8 8 v 20 h -320 z" fill="#ecd8ff"/>
  <line x1="40" y1="128" x2="360" y2="128" stroke="#8250df" stroke-width="1.5"/>
  <text x="56" y="122" font-size="13.5" font-weight="700" fill="#6639ba">OnlineShoppingService</text>
  <text x="56" y="150" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Users<tspan fill="#57606a">     map[string]*User</tspan></text>
  <text x="56" y="172" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Products<tspan fill="#57606a">  map[string]*Product</tspan></text>
  <text x="56" y="194" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Orders<tspan fill="#57606a">    map[string]*Order</tspan></text>
  <line x1="40" y1="206" x2="360" y2="206" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="226" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6639ba">RegisterUser()</text>
  <text x="56" y="248" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6639ba">AddProduct()</text>
  <text x="56" y="270" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6639ba">SearchProducts()</text>
  <text x="56" y="292" font-size="12" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#6639ba">PlaceOrder()</text>

  <!-- ============ USER ============ -->
  <rect x="410" y="100" width="250" height="180" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 410 108 a 8 8 0 0 1 8 -8 h 234 a 8 8 0 0 1 8 8 v 20 h -250 z" fill="#ddf4ff"/>
  <line x1="410" y1="128" x2="660" y2="128" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="426" y="122" font-size="13.5" font-weight="700" fill="#0550ae">User</text>
  <text x="426" y="150" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">ID<tspan fill="#57606a">        string</tspan></text>
  <text x="426" y="172" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Name<tspan fill="#57606a">      string</tspan></text>
  <text x="426" y="194" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Email<tspan fill="#57606a">     string</tspan></text>
  <text x="426" y="216" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Password<tspan fill="#57606a">  string</tspan></text>
  <text x="426" y="238" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Orders<tspan fill="#57606a">    []Order</tspan></text>
  <line x1="410" y1="250" x2="660" y2="250" stroke="#d0d7de" stroke-width="1"/>
  <text x="426" y="270" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">AddOrder()</text>

  <!-- ============ SHOPPING CART ============ -->
  <rect x="710" y="100" width="270" height="158" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 710 108 a 8 8 0 0 1 8 -8 h 254 a 8 8 0 0 1 8 8 v 20 h -270 z" fill="#ddf4ff"/>
  <line x1="710" y1="128" x2="980" y2="128" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="726" y="122" font-size="13.5" font-weight="700" fill="#0550ae">ShoppingCart</text>
  <text x="963" y="122" font-size="10" font-weight="700" fill="#0550ae" text-anchor="end">mutable</text>
  <text x="726" y="150" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">items<tspan fill="#57606a">  map[string]OrderItem</tspan></text>
  <line x1="710" y1="162" x2="980" y2="162" stroke="#d0d7de" stroke-width="1"/>
  <text x="726" y="182" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">AddItem()</text>
  <text x="726" y="204" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">RemoveItem()</text>
  <text x="726" y="226" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">GetItems()</text>
  <text x="726" y="248" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">Clear()</text>

  <!-- ============ PRODUCT ============ -->
  <rect x="1010" y="100" width="240" height="205" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 1010 108 a 8 8 0 0 1 8 -8 h 224 a 8 8 0 0 1 8 8 v 20 h -240 z" fill="#ddf4ff"/>
  <line x1="1010" y1="128" x2="1250" y2="128" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="1026" y="122" font-size="13.5" font-weight="700" fill="#0550ae">Product</text>
  <text x="1026" y="150" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">ID<tspan fill="#57606a">          string</tspan></text>
  <text x="1026" y="172" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Name<tspan fill="#57606a">        string</tspan></text>
  <text x="1026" y="194" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Description<tspan fill="#57606a"> string</tspan></text>
  <text x="1026" y="216" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Price<tspan fill="#57606a">       money</tspan></text>
  <text x="1026" y="238" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#cf222e">Quantity<tspan fill="#a4404f">    int</tspan></text>
  <line x1="1010" y1="250" x2="1250" y2="250" stroke="#d0d7de" stroke-width="1"/>
  <text x="1026" y="270" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">UpdateQuantity()</text>
  <text x="1026" y="292" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">IsAvailable()</text>

  <!-- ============ ORDER ============ -->
  <rect x="410" y="350" width="250" height="205" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <path d="M 410 358 a 8 8 0 0 1 8 -8 h 234 a 8 8 0 0 1 8 8 v 20 h -250 z" fill="#d2f8d2"/>
  <line x1="410" y1="378" x2="660" y2="378" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="426" y="372" font-size="13.5" font-weight="700" fill="#0f5323">Order</text>
  <text x="643" y="372" font-size="10" font-weight="700" fill="#0f5323" text-anchor="end">frozen</text>
  <text x="426" y="400" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">ID<tspan fill="#57606a">          string</tspan></text>
  <text x="426" y="422" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">User<tspan fill="#57606a">        *User</tspan></text>
  <text x="426" y="444" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Items<tspan fill="#57606a">       []OrderItem</tspan></text>
  <text x="426" y="466" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">TotalAmount<tspan fill="#57606a"> money</tspan></text>
  <text x="426" y="488" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Status<tspan fill="#57606a">      OrderStatus</tspan></text>
  <line x1="410" y1="500" x2="660" y2="500" stroke="#d0d7de" stroke-width="1"/>
  <text x="426" y="520" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0f5323">calculateTotal()</text>
  <text x="426" y="542" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0f5323">SetStatus()</text>

  <!-- ============ ORDERITEM ============ -->
  <rect x="710" y="350" width="270" height="85" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 710 358 a 8 8 0 0 1 8 -8 h 254 a 8 8 0 0 1 8 8 v 20 h -270 z" fill="#ddf4ff"/>
  <line x1="710" y1="378" x2="980" y2="378" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="726" y="372" font-size="13.5" font-weight="700" fill="#0550ae">OrderItem</text>
  <text x="726" y="400" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#cf222e">Product<tspan fill="#a4404f">   *Product</tspan></text>
  <text x="726" y="422" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Quantity<tspan fill="#57606a">  int</tspan></text>

  <!-- ============ ORDERSTATUS ============ -->
  <rect x="1010" y="350" width="240" height="150" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <path d="M 1010 358 a 8 8 0 0 1 8 -8 h 224 a 8 8 0 0 1 8 8 v 20 h -240 z" fill="#fff1c2"/>
  <line x1="1010" y1="378" x2="1250" y2="378" stroke="#9a6700" stroke-width="1.5"/>
  <text x="1026" y="372" font-size="13.5" font-weight="700" fill="#7d4e00">«enum» OrderStatus</text>
  <text x="1026" y="400" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Pending</text>
  <text x="1026" y="422" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Processing</text>
  <text x="1026" y="444" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Shipped</text>
  <text x="1026" y="466" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Delivered</text>
  <text x="1026" y="488" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">Cancelled</text>

  <!-- ============ PAYMENT ============ -->
  <rect x="410" y="610" width="250" height="65" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <path d="M 410 618 a 8 8 0 0 1 8 -8 h 234 a 8 8 0 0 1 8 8 v 20 h -250 z" fill="#eaeef2"/>
  <line x1="410" y1="638" x2="660" y2="638" stroke="#57606a" stroke-width="1.5"/>
  <text x="426" y="632" font-size="13.5" font-weight="700" fill="#24292f">«interface» Payment</text>
  <text x="426" y="660" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#24292f">ProcessPayment(amount)</text>

  <!-- ============ CREDIT CARD ============ -->
  <rect x="710" y="610" width="270" height="65" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 710 618 a 8 8 0 0 1 8 -8 h 254 a 8 8 0 0 1 8 8 v 20 h -270 z" fill="#ddf4ff"/>
  <line x1="710" y1="638" x2="980" y2="638" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="726" y="632" font-size="13.5" font-weight="700" fill="#0550ae">CreditCardPayment</text>
  <text x="726" y="660" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">ProcessPayment(amount)</text>

  <!-- ============ ARROWS ============ -->
  <line x1="360" y1="190" x2="403" y2="190" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="381" y="182" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">owns</text>

  <path d="M 360 260 C 385 268, 385 378, 402 388" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="352" y="330" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="end">stores</text>

  <path d="M 150 305 L 150 640 L 402 640" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="165" y="600" font-size="10.5" font-weight="600" fill="#57606a">uses</text>

  <line x1="535" y1="280" x2="535" y2="343" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="545" y="318" font-size="10.5" font-weight="600" fill="#57606a">places</text>

  <line x1="845" y1="258" x2="845" y2="343" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="855" y="308" font-size="10.5" font-weight="600" fill="#57606a">holds</text>

  <line x1="660" y1="392" x2="703" y2="392" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="681" y="384" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">has</text>

  <path d="M 660 470 L 1003 470" stroke="#6e7781" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="830" y="462" font-size="10.5" font-weight="600" fill="#57606a" text-anchor="middle">has status</text>

  <path d="M 980 390 C 1040 390, 1060 340, 1090 312" stroke="#cf222e" stroke-width="1.8" fill="none" marker-end="url(#r)"/>
  <text x="1058" y="378" font-size="10.5" font-weight="700" fill="#cf222e">live ref</text>

  <line x1="703" y1="642" x2="667" y2="642" stroke="#6e7781" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#impl)"/>
  <text x="685" y="670" font-size="10" font-weight="600" fill="#57606a" text-anchor="middle">implements</text>
</svg>
